# Configuration for the 3D U-Net BraTS 2019 segmentation pipeline.
# Paths are relative to the repository root unless absolute.

output_dir: outputs
seed: 42

data:
  data_root: data/raw
  modalities: [flair, t1, t1ce, t2]
  target_shape: [128, 128, 128]
  patch_size: null        # set e.g. [64, 64, 64] for memory-friendly training
  normalize: true
  remap_labels: true
  load_seg: true
  val_split: 0.2
  seed: 42
  shuffle_buffer: 8

model:
  input_shape: null       # inferred as target_shape + (num modalities,)
  base_filters: 32
  dropout_rate: 0.2
  num_classes: 4
  name: 3D_UNet_BraTS

train:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  class_weights: [0.1, 0.3, 0.3, 0.3]
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.1
  shuffle_buffer: 8
